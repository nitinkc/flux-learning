# Stage: package — lint and package the Helm chart, keep the .tgz as an
# artifact for the deploy stage (and for promotion to later environments).

chart:package:
  stage: package
  needs:
    - job: build:kaniko
      optional: true   # chart-only change: package without rebuilding the image
  image: alpine/helm:3.16.3
  script:
    - helm lint ${CHART_DIR} --set image.repository=test/app,image.tag=test
    - helm package ${CHART_DIR} --destination ${CI_PROJECT_DIR}/dist
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 1 week
  rules:
    - changes:
        - ${CHART_DIR}/**/*
        - ${APP_DIR}/**/*
