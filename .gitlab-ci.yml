# spring-app pipeline — test → build → package → deploy
#
# The stage files under .gitlab/ci/ are composed here with `include:local:`.
# Read docs/01-pipeline-anatomy.md first, then docs/05-reusable-pipelines.md
# to see why the file is split this way.

workflow:
  rules:
    # MR pipelines (merge results)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Branch pipelines — skip when an MR already covers the same commit
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - security
  - package
  - deploy

include:
  # Scans every commit for accidentally committed secrets (lightweight;
  # GitLab also ships template includes for SAST, Dependency-Scanning and
  # Container-Scanning — same include pattern if you want them).
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/build-kaniko.yml'
  - local: '.gitlab/ci/security.yml'
  - local: '.gitlab/ci/package-chart.yml'
  - local: '.gitlab/ci/deploy.yml'

variables:
  APP_DIR: app
  CHART_DIR: chart/spring-app
  IMAGE_TAG: ${CI_REGISTRY_IMAGE}/spring-app:${CI_COMMIT_SHORT_SHA}
