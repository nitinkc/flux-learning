# Reusable: build — image build pushed to the project container
# registry. Port of .gitlab/ci/build-kaniko.yml.
#
# No kaniko needed: GitHub runners ship a Docker daemon, so buildx is
# the idiomatic equivalent of the rootless executor image. Registry
# auth is the built-in GITHUB_TOKEN — the CI_REGISTRY_USER/_PASSWORD
# predefined variables all in one.

name: reusable-build

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: ${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
